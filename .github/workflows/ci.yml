name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy
      - name: pose geometry, yaw convention, pixel scale (hand-computed cases)
        run: python test_common.py
      - name: README numbers vs runs/*/metrics.json
        run: python test_readme.py

  model:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # CPU wheel only; the model is tiny and CI has no GPU.
      - run: pip install numpy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: parameter counts (130k / 27k) and soft-argmax convention (hand-computed cases)
        run: python test_model.py
